[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sme-assistant"
version = "0.1.0"
description = "Privacy-preserving on-device agentic RAG assistant for SME knowledge management"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Md Basar Basar" }]
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.4"]
# The exact versions that drew the committed figures. Amendments 1.30.7 and
# 1.30.11. The loose "plots" extra above is for anyone who wants to run the
# scripts; this one reproduces the images in docs/dissertation/figures byte for
# byte on the machine that owns this repository. FreeType decides glyph
# rasterisation and is not installable from here; matplotlib 3.11 bundles 2.14.3
# where 3.10 bundled 2.6.1, which is why the two produce different text
# positions from identical geometry. The version actually used is recorded in
# figures/FIGURE_ENVIRONMENT.json beside the images.
# Pillow writes the PNG bytes and is pinned for the same reason
# matplotlib is; amendment 1.31.4.
figures = ["matplotlib==3.11.1", "numpy==2.5.1", "pillow==12.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
