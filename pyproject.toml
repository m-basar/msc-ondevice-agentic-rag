[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sme-assistant"
version = "0.1.0"
description = "Privacy-preserving on-device agentic RAG assistant for SME knowledge management"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Md Basar Basar" }]
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.4"]
# The exact versions that drew the committed figures. Amendment 1.30.7. The
# loose "plots" extra above is for anyone who wants to run the scripts; this one
# reproduces the images in docs/dissertation/figures byte for byte. FreeType
# decides glyph rasterisation and is not installable from here, so the version
# it was drawn with is recorded in figures/FIGURE_ENVIRONMENT.json instead.
figures = ["matplotlib==3.10.9", "numpy==2.4.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
